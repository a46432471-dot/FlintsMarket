<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=yes, viewport-fit=cover" />
    <meta name="description" content="FlintsMarket - Login to your trading account" />
    <title>FlintsMarket | Login</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,20 80,40 80,70 50,90 20,70 20,40' fill='%23c99a3b'/%3E%3C/svg%3E" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
                   DARK THEME — MATCHES INDEX PAGE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #0d1224;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --text-primary: #f0ede8;
            --text-secondary: #b0abc4;
            --text-muted: #6b6882;
            --border-color: rgba(255, 255, 255, 0.04);
            --gold-primary: #c99a3b;
            --gold-light: #e8c86a;
            --gold-gradient: linear-gradient(135deg, #c99a3b, #e8c86a, #b8862a);
            --emerald: #3dd68c;
            --rose: #f4727a;
            --blue-accent: #4a8cf7;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --radius-full: 60px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(201, 154, 59, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(201, 154, 59, 0.03) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(61, 214, 140, 0.02) 0%, transparent 40%);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-30px, 20px) scale(1.05); }
            66% { transform: translate(20px, -30px) scale(0.95); }
        }

        /* ===== LOGIN CONTAINER ===== */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
            margin: 1rem;
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-card);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(201, 154, 59, 0.08);
        }

        /* ===== LOGO ===== */
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo .logo-icon {
            width: 56px;
            height: 56px;
            background: var(--gold-gradient);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #0a0e1a;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(201, 154, 59, 0.25);
            margin-bottom: 0.8rem;
        }

        .login-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .login-logo h1 span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-logo p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group .input-wrap {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .form-group .input-wrap:focus-within {
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(201, 154, 59, 0.05);
        }

        .form-group .input-wrap i {
            padding: 0 0 0 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group .input-wrap input {
            flex: 1;
            padding: 0.8rem 1rem;
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            min-width: 0;
        }

        .form-group .input-wrap input::placeholder {
            color: var(--text-muted);
        }

        /* ===== OPTIONS ROW ===== */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .options-row .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .options-row .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold-primary);
            cursor: pointer;
        }

        .options-row .forgot-link {
            font-size: 0.8rem;
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .options-row .forgot-link:hover {
            text-decoration: underline;
        }

        /* ===== BUTTONS ===== */
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--gold-gradient);
            color: #0a0e1a;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(201, 154, 59, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== DIVIDER ===== */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ===== SOCIAL LOGIN ===== */
        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .social-btn {
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .social-btn:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .social-btn i {
            font-size: 1.1rem;
        }

        .social-btn.google i { color: #ea4335; }
        .social-btn.apple i { color: var(--text-primary); }

        /* ===== SIGNUP LINK ===== */
        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .signup-link a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* ===== ERROR MESSAGE ===== */
        .error-msg {
            display: none;
            background: rgba(244, 114, 122, 0.08);
            border: 1px solid rgba(244, 114, 122, 0.15);
            border-radius: var(--radius-sm);
            padding: 0.6rem 1rem;
            color: var(--rose);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .error-msg.show {
            display: block;
        }

        /* ===== SUCCESS MESSAGE ===== */
        .success-msg {
            display: none;
            background: rgba(61, 214, 140, 0.08);
            border: 1px solid rgba(61, 214, 140, 0.15);
            border-radius: var(--radius-sm);
            padding: 0.6rem 1rem;
            color: var(--emerald);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .success-msg.show {
            display: block;
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.8rem 1.2rem;
            }
            .login-logo .logo-icon {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
            .login-logo h1 {
                font-size: 1.3rem;
            }
            .social-login {
                grid-template-columns: 1fr;
            }
            .options-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .btn-login {
                font-size: 0.9rem;
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- ===== ANIMATED BACKGROUND ===== -->
    <div class="bg-glow"></div>

    <!-- ===== LOGIN CONTAINER ===== -->
    <div class="login-container">
        <div class="login-card">

            <!-- ===== LOGO ===== -->
            <div class="login-logo">
                <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
                <h1>Flints<span>Market</span></h1>
                <p>Welcome back! Login to your account</p>
            </div>

            <!-- ===== ERROR MESSAGE ===== -->
            <div class="error-msg" id="errorMsg">
                <i class="fas fa-exclamation-circle" style="margin-right:6px;"></i>
                <span id="errorText">Invalid email or password. Please try again.</span>
            </div>

            <!-- ===== SUCCESS MESSAGE ===== -->
            <div class="success-msg" id="successMsg">
                <i class="fas fa-check-circle" style="margin-right:6px;"></i>
                <span id="successText">Login successful! Redirecting...</span>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="emailInput" placeholder="you@example.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="passwordInput" placeholder="Enter your password" required autocomplete="current-password" />
                    </div>
                </div>

                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox" checked /> Remember me
                    </label>
                    <a href="#" class="forgot-link" onclick="showMessage('Password reset link sent to your email')">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-arrow-right" style="margin-right:8px;"></i>
                    Login
                </button>
            </form>

            <!-- ===== DIVIDER ===== -->
            <div class="divider">
                <span>Or continue with</span>
            </div>

            <!-- ===== SOCIAL LOGIN ===== -->
            <div class="social-login">
                <button class="social-btn google" onclick="showMessage('Google login coming soon')">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn apple" onclick="showMessage('Apple login coming soon')">
                    <i class="fab fa-apple"></i> Apple
                </button>
            </div>

            <!-- ===== SIGNUP LINK ===== -->
            <div class="signup-link">
                Don't have an account? <a href="signup.html">Create one</a>
            </div>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script type="module">
        import { signIn, getSession } from './supabase.js'

        // ===== CHECK IF ALREADY LOGGED IN =====
        async function checkSession() {
            const session = await getSession()
            if (session) {
                window.location.href = 'dashboard.html'
            }
        }
        checkSession()

        // ===== HANDLE LOGIN =====
        window.handleLogin = async function(event) {
            event.preventDefault()

            const email = document.getElementById('emailInput').value.trim()
            const password = document.getElementById('passwordInput').value
            const errorMsg = document.getElementById('errorMsg')
            const successMsg = document.getElementById('successMsg')
            const btn = document.getElementById('loginBtn')
            const errorText = document.getElementById('errorText')

            // Hide previous messages
            errorMsg.classList.remove('show')
            successMsg.classList.remove('show')

            // Validate
            if (!email || !password) {
                errorText.textContent = '⚠️ Please enter both email and password.'
                errorMsg.classList.add('show')
                return
            }

            if (!email.includes('@')) {
                errorText.textContent = '⚠️ Please enter a valid email address.'
                errorMsg.classList.add('show')
                return
            }

            // Show loading state
            const originalText = btn.innerHTML
            btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Logging in...'
            btn.disabled = true

            try {
                const { data, error } = await signIn(email, password)

                if (error) {
                    errorText.textContent = '❌ ' + error.message
                    errorMsg.classList.add('show')
                    btn.innerHTML = originalText
                    btn.disabled = false
                    return
                }

                if (data?.user) {
                    // Success
                    successMsg.classList.add('show')
                    document.getElementById('successText').textContent = '✅ Login successful! Redirecting...'
                    
                    btn.innerHTML = '✅ Success!'
                    btn.style.background = 'linear-gradient(135deg, #3dd68c, #2d9b6e)'

                    setTimeout(() => {
                        window.location.href = 'dashboard.html'
                    }, 1200)
                }
            } catch (err) {
                errorText.textContent = '❌ An unexpected error occurred. Please try again.'
                errorMsg.classList.add('show')
                btn.innerHTML = originalText
                btn.disabled = false
            }
        }

        // ===== SHOW MESSAGE =====
        window.showMessage = function(msg) {
            alert(msg)
        }

        // ===== KEYBOARD SUPPORT =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('loginForm')
                if (form) {
                    form.dispatchEvent(new Event('submit'))
                }
            }
        })

        console.log('🔐 FlintsMarket Login Page loaded!')
        console.log('📧 Login with email and password to access your account.')
    </script>
</body>
</html>
